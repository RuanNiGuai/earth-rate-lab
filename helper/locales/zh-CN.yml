    solve: "联合使用全部十台；保留各自加速度与杆臂，输出训练／留出误差。旧单台联合重建是下面独立的功能。"
    plan: "地球项训练／留出 RMS ≤0.001°/s，g-sens ≤0.006°/s，温度覆盖与完整性必须通过。失败只保留诊断，不提供默认强制写入。"
    apply: "先核对十台现状与备份，再逐项写入；出现失败尝试恢复已修改项。多台写入不是原子事务，请查看每台结果。"
    verify: "核对当前快照与计划。重启后再次执行才能检验重启保持；本按钮不会自行重启。"
