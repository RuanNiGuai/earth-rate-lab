  wizard:
    plan_rejected: "审阅未通过：下方列出实测值与门槛。未生成写入计划，已有录制和求解结果已保留。"
    preflight_failed: "会话已保留，但预检未通过。请处理下方问题后再次点击准备。"
    setup: "1 · 固定十台，连接接收器"
    setup_help: "把十台同向固定在刚性夹具上，接收器连接电脑，全程保持夹具牢固。只接一个接收器时会自动选择。点击准备后创建并核验会话；数据自动保存在本机，重新打开程序可继续上次。已有温度表应覆盖本次温度，自动温度采集请保持关闭。"
    axes: "2 · 依次录制 X、Y、Z 轴正反转"
    axis_help: "让所选轴竖直朝上并放稳，点击该轴录制；准备时会显示每台朝上的面，方向不符时请调整夹具。等 READY 后，一次完成：①静置约 30 秒 → ②同方向平稳转 20 圈 → ③静置约 30 秒 → ④反方向平稳转 20 圈 → ⑤静置约 30 秒，然后点结束。每圈约 2–3 秒，保持同一面朝上；中途无需按按钮，程序持续记录全部过程。换轴后重复。"
    poses: "3 · 连续录制地球项、g-sens 与首尾检查"
    poses_help: "恢复 +X 面朝上，记住一条边的指向。点击录制，等 READY 后连续完成：+X 面朝上时依次在原方向、同向 90°、180°、270°、360°静置，每段建议 90–120 秒；随后让 −X、+Y、−Y、+Z、−Z 各朝上一次，每段约 30 秒，转换约 10 秒。建议最后回到最初的 +X 面及同一条边的原方向，再静置 90–120 秒，作为第11段首尾检查。完成全部静置后点结束，中途无需确认。旧的完整十段录制仍可用；加长时间不保证误差一定达标。"
    solve: "4 · 自动备份、检查和联合求解"
    solve_help: "保持十台开机，停止自动温度采集。程序无线读取各台温度表与原参数，自动对齐四次录制的时钟、识别动作区间，并使用全部十台数据求解。每台加速度和安装位置分别建模。纬度可从地图或手机定位查看，北纬为正。检查失败时会说明需重录哪一步，已有文件全部保留。"
    install: "5 · 审阅结果，再决定是否写入"
    install_help: "先查看误差与正反转差异，再把夹具恢复到第 3 步最初的 +X 朝上及同一条边的方向。生成计划会检查温度、完整性、正反转一致性和留出误差。方向差异明显时保留正负系数候选及全程数据供固件分析，不直接平均后放行。写入后手动重启十台，再点重启后核验。"
    confirm: "已审阅推荐结果并恢复原始 +X 朝上与朝向；同意生成计划（尚不写入）"
    confirm_write: "已审阅计划并确认原始 +X 朝上与朝向；同意本次实际写入"
    advanced: "高级工具与旧会话兼容（正常流程不需要）"
