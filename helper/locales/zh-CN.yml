    limits: "回位没有外部角度真值；校准和检验共用录制，积分均值不能还原高频运动，且缺设备加速度矩阵。低通／动态零偏的回放不会通过参数写入启用。"
    retained: "地球项与 g-sens 均保留备份值：地球方向收益尚不足，g-sens 缺已安装加速度坐标变换。未采用字段的诊断不阻止已验证比例写入。下列 RMS 为六次 20 圈三分量角度误差。"
