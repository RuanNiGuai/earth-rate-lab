# ARC8 NCS PM candidate. This file is not automatically selected and does not
# change the working ARC7 NVS layout. Validate with real sysbuild output.
bootloader:
  address: 0x0
  end_address: 0x1000
  region: flash_primary
  size: 0x1000
mcuboot:
  address: 0x1000
  end_address: 0xf000
  region: flash_primary
  size: 0xe000
mcuboot_primary:
  address: 0xf000
  end_address: 0x7e000
  region: flash_primary
  size: 0x6f000
  span:
  - mcuboot_pad
  - app
mcuboot_pad:
  address: 0xf000
  end_address: 0xf200
  region: flash_primary
  size: 0x200
app:
  address: 0xf200
  end_address: 0x7e000
  region: flash_primary
  size: 0x6ee00
mcuboot_secondary:
  address: 0x7e000
  end_address: 0xee000
  region: flash_primary
  size: 0x70000
nvs_storage:
  address: 0xee000
  end_address: 0xf4000
  region: flash_primary
  size: 0x6000
uf2_bootloader:
  address: 0xf4000
  end_address: 0x100000
  region: flash_primary
  size: 0xc000
# Reserve low 32 KiB for both boot stages, retained state and DFU marker.
sram_primary:
  address: 0x20008000
  end_address: 0x20040000
  region: sram_primary
  size: 0x38000
