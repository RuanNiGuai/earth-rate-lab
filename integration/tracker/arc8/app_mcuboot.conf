# ARC8 application ONLY. Never apply to the existing stable-0.18.0-14 firmware.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_MCUBOOT_BOOTLOADER_MODE_SWAP_USING_OFFSET=y
# Zephyr v4.1 dfu/boot/mcuboot.c is compiled ONLY when
# CONFIG_MCUBOOT_IMG_MANAGER=y; BOOTLOADER_MCUBOOT alone is insufficient.
# STREAM_FLASH satisfies IMG_MANAGER Kconfig dependencies.
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
# Preserve existing UART, radio, calibration, NVS, and sensor settings from prj.conf.
# Signed image generation is an explicit, separate build step.

# ARC8-B OTA transport is enabled only in this experimental MCUboot build.
CONFIG_ARC8_ESB_OTA=y
CONFIG_ARC8_ESB_OTA_ACTIVATE=n
