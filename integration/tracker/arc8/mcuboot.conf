# Append only to boot/zephyr MCUboot application. NEVER to tracker prj.conf.
# This selection must be verified in actual build/zephyr/.config.
CONFIG_BOOT_SWAP_USING_OFFSET=y
CONFIG_BOOT_VALIDATE_SLOT0=y
# Uses MCUboot's real signing/verification configuration supplied by the
# installed NCS version. No private keys or example keys in this package.

# ARC8-B: verify OTA images with ECDSA-P256. Never use MCUboot sample keys.
CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
